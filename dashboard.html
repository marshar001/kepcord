<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d1614">
  <title>Dashboard — Kepcord</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell"><main class="pg" id="page"></main></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
const svgIcon = (d, s) => `<svg width="${s || 20}" height="${s || 20}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const EYE = '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>';
const EYE_OFF = '<path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.5 6.6A16.6 16.6 0 0 0 2 12s3.6 7 10 7a9.8 9.8 0 0 0 4.4-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>';
const BOLT = '<path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z" fill="currentColor"/>';

// Money with the kobo small and grey, like a balance card.
function money(n, hide) {
  if (hide) return '<span class="cur">₦</span>•••••';
  const [i, d] = Number(n || 0).toFixed(2).split(".");
  return `<span class="cur">₦</span>${Number(i).toLocaleString("en-NG")}<span class="dec">.${d}</span>`;
}

// Smooth filled line across the bottom of the card.
function area(data) {
  const W = 400, H = 130, top = 34, base = 8, n = data.length;
  const max = Math.max(1, ...data.map((d) => d.value));
  const pts = data.map((d, i) => [n === 1 ? W / 2 : (W * i) / (n - 1), H - base - ((H - top - base) * d.value) / max]);
  const clampY = (y) => Math.min(H - 2, Math.max(top - 8, y));
  let path = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    path += ` C${p1[0] + (p2[0] - p0[0]) / 6},${clampY(p1[1] + (p2[1] - p0[1]) / 6)} ${p2[0] - (p3[0] - p1[0]) / 6},${clampY(p2[1] - (p3[1] - p1[1]) / 6)} ${p2[0]},${p2[1]}`;
  }
  const total = data.reduce((s, d) => s + d.value, 0);
  return `<svg class="area" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Sales over the last ${n} days, total ${naira(total)}">
    <defs><linearGradient id="fillg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3a47f" stop-opacity="0.75"/><stop offset="1" stop-color="#e3a47f" stop-opacity="0.04"/>
    </linearGradient></defs>
    <path d="${path} L${W},${H} L0,${H} Z" fill="url(#fillg)"/>
    <path d="${path}" fill="none" stroke="#e3a47f" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

// Thin bars with a round head, one per hour.
function hourChart(hours) {
  const used = hours.filter((h) => h.value > 0).map((h) => h.hour);
  const lo = Math.min(6, ...used), hi = Math.max(20, ...used);
  const data = hours.slice(lo, hi + 1);
  const W = 360, H = 190, pad = { l: 8, r: 8, t: 26, b: 24 };
  const max = Math.max(1, ...data.map((d) => d.value));
  const step = (W - pad.l - pad.r) / data.length;
  const peak = data.reduce((a, b) => (b.value > a.value ? b : a), data[0]);
  const fmt = (h) => (h % 12 || 12) + (h < 12 ? "am" : "pm");
  const bars = data.map((d, i) => {
    const x = pad.l + i * step + step / 2;
    const h = ((H - pad.t - pad.b) * d.value) / max;
    const y = H - pad.b - h;
    return `<g><title>${fmt(d.hour)}: ${naira(d.value)} (${d.count} orders)</title>
      ${d.value ? `<rect x="${x - 3.5}" y="${y}" width="7" height="${h}" rx="3.5" fill="#e3a47f"/><circle cx="${x}" cy="${y}" r="6" fill="#b8624a"/>` : `<circle cx="${x}" cy="${H - pad.b}" r="2.5" fill="#5f514b"/>`}
      ${i % 2 === 0 ? `<text x="${x}" y="${H - 6}" text-anchor="middle">${d.hour}</text>` : ""}</g>`;
  }).join("");
  return { peak, fmt, svg: `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Sales by hour of the day">
    <line x1="${pad.l}" x2="${W - pad.r}" y1="${H - pad.b}" y2="${H - pad.b}" stroke="#5f514b" stroke-width="2"/>${bars}</svg>` };
}

boot({ id: "dashboard", mgmt: true }, async (me, root) => {
  const shop = (await api.shop.info()).name;
  const [sum, series] = await Promise.all([api.reports.summary(), api.reports.salesByDay(14)]);
  const week = series.slice(-7);

  let hide = false, slide = 0;
  try { hide = localStorage.getItem("kepcord_hide") === "1"; } catch (e) {}
  const slides = [
    { label: "Sales today", value: sum.todaySales },
    { label: "Last 7 days", value: sum.weekSales },
  ];
  const delta = sum.todaySales - sum.yesterdaySales;
  const up = delta >= 0;

  root.innerHTML = `
    <div class="hello">
      <h1>Welcome back, ${esc(me.name.split(" ")[0])}!</h1>
      <p class="hot">Here is how ${esc(shop)} is doing.</p>
    </div>

    <div class="dash-top">
      <section class="bal" aria-label="Sales summary">
        <div class="bal-top">
          <div>
            <div class="lbl"><span id="lbl"></span>
              <button class="eye2" id="eye" type="button"></button></div>
            <div class="amt" id="amt"></div>
          </div>
          <div class="bolt" role="img" aria-label="${sum.todayOrders} orders today">${svgIcon(BOLT, 22)} ${sum.todayOrders}</div>
        </div>
        <div class="dots" role="tablist" aria-label="Choose figure">
          ${slides.map((s, i) => `<button type="button" role="tab" data-slide="${i}" aria-label="${s.label}"><i></i></button>`).join("")}
        </div>
        ${area(week)}
        <div class="bal-foot">
          <span class="pill" id="pill"></span>
          <a class="more" href="orders.html">All orders ${svgIcon('<path d="m9 6 6 6-6 6"/>', 18)}</a>
        </div>
      </section>

      <div class="stats">
        <div><b>${sum.todayOrders}</b><span>Orders today</span></div>
        <div><b>${sum.lowCount}</b><span>Low or out of stock</span></div>
        <div><b>${sum.openReqs}</b><span>Open requisitions</span></div>
        <div><b>${sum.top.length ? esc(sum.top[0].name) : "—"}</b><span>Best seller (30 days)</span></div>
      </div>
    </div>

    <h2>Previous deals</h2>
    <p class="mu" style="margin-top:-4px">Tap a day to see its sales chart and every order from that day.</p>
    <div class="days" id="days" role="group" aria-label="Choose a day"></div>
    <div id="dayview" aria-live="polite"></div>`;

  // ----- balance card -----
  const $ = (id) => document.getElementById(id);
  function drawBal() {
    $("lbl").textContent = slides[slide].label;
    $("amt").innerHTML = money(slides[slide].value, hide);
    $("eye").innerHTML = svgIcon(hide ? EYE_OFF : EYE, 20);
    $("eye").setAttribute("aria-label", hide ? "Show amounts" : "Hide amounts");
    root.querySelectorAll("[data-slide]").forEach((b) => b.setAttribute("aria-selected", String(Number(b.dataset.slide) === slide)));
    $("pill").innerHTML = sum.todaySales === 0 && sum.yesterdaySales === 0
      ? "No sales yet today"
      : `${hide ? "•••" : naira(Math.abs(delta))} ${up ? "more" : "less"} than yesterday ${svgIcon(up ? '<path d="m6 15 6-6 6 6"/>' : '<path d="m6 9 6 6 6-6"/>', 18)}`;
  }
  $("eye").onclick = () => {
    hide = !hide;
    try { localStorage.setItem("kepcord_hide", hide ? "1" : "0"); } catch (e) {}
    drawBal();
  };
  root.querySelectorAll("[data-slide]").forEach((b) => (b.onclick = () => { slide = Number(b.dataset.slide); drawBal(); }));
  drawBal();

  // ----- day chips -----
  const daysEl = $("days");
  daysEl.innerHTML = series.map((d, i) => {
    const dt = new Date(d.date + "T12:00:00");
    return `<button type="button" class="daychip${d.value > 0 ? " has" : ""}" data-day="${d.date}" aria-pressed="false">
      <span>${i === series.length - 1 ? "Today" : dt.toLocaleDateString("en-NG", { weekday: "short" })}</span><b>${dt.getDate()}</b><i></i></button>`;
  }).join("");

  let token = 0;
  async function showDay(key) {
    const mine = ++token;
    daysEl.querySelectorAll(".daychip").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.day === key)));
    try {
      const [hours, orders] = await Promise.all([api.reports.hours(key), api.orders.day(key)]);
      if (mine !== token) return; // a newer tap arrived
      const live = orders.filter((o) => !o.voided);
      const total = live.reduce((s, o) => s + o.total, 0);
      const title = new Date(key + "T12:00:00").toLocaleDateString("en-NG", { weekday: "long", day: "numeric", month: "long" });
      let chart = "";
      if (live.length) {
        const c = hourChart(hours);
        chart = `<div class="daycard"><h4>Sales by hour</h4>
          <p class="mu">Busiest hour: <b style="color:var(--ink)">${c.fmt(c.peak.hour)}</b> · ${naira(c.peak.value)}</p>${c.svg}</div>`;
      }
      $("dayview").innerHTML = `
        <div class="dayhead">
          <h3>${esc(title)}</h3>
          <div class="tot"><b>${naira(total)}</b> · ${live.length} ${live.length === 1 ? "order" : "orders"}${orders.length > live.length ? ` · ${orders.length - live.length} voided` : ""}</div>
        </div>
        ${orders.length === 0 ? '<p class="mu">No deals on this day.</p>' : `<div class="daybody${chart ? " split" : ""}"><div>${chart}</div><div>` + orders.map((o) => `
          <div class="deal${o.voided ? " void" : ""}">
            <span class="t">${timeOnly(o.at)}</span>
            <span class="it">${o.lines.map((l) => `${num(l.qty)} × ${esc(l.name)}`).join(", ")}${o.voided ? '<span class="tag">VOIDED</span>' : ""}</span>
            <span class="pr">${naira(o.total)}</span>
            <span class="by">${esc(o.byName)}</span>
          </div>`).join("") + "</div></div>"}`;
    } catch (e) { toast(e.message, true); }
  }
  daysEl.addEventListener("click", (e) => {
    const b = e.target.closest(".daychip");
    if (!b) return;
    showDay(b.dataset.day);
    b.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
  });
  daysEl.scrollLeft = daysEl.scrollWidth;
  await showDay(series[series.length - 1].date);
});
  </script>
</body>
</html>
