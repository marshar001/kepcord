<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173B33">
  <title>Kepcord</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="auth">
    <div class="mark">
      <div class="logo">K</div>
      <div class="word">KEPCORD</div>
    </div>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
    <form class="card" id="form"></form>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
const ico = (d) => `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  mail: ico('<rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 8 8 5 8-5"/>'),
  lock: ico('<rect x="5" y="11" width="14" height="9" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
  user: ico('<circle cx="12" cy="8" r="4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>'),
  shop: ico('<path d="M4 9 5.5 4h13L20 9"/><path d="M4 9a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0A2.7 2.7 0 0 0 20 9"/><path d="M5 12v8h14v-8"/>'),
  eye: ico('<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>'),
  eyeOff: ico('<path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.5 6.6A16.6 16.6 0 0 0 2 12s3.6 7 10 7a9.8 9.8 0 0 0 4.4-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>'),
  arrow: ico('<path d="M5 12h14M13 6l6 6-6 6"/>'),
};

function field(id, label, icon, type, placeholder, autocomplete, hint, aside) {
  return `<div class="field">
    <div class="lab"><label for="${id}">${label}${hint ? ` <span class="hint">${hint}</span>` : ""}</label>${aside || ""}</div>
    <div class="fl">${icon}
      <input id="${id}" type="${type}" placeholder="${placeholder}" autocomplete="${autocomplete}" required>
      ${type === "password" ? `<button type="button" class="eye" id="eye" aria-label="Show password">${ICON.eye}</button>` : ""}
    </div>
  </div>`;
}

(async () => {
  const me = await api.auth.session();
  if (me) return location.replace(me.role === "management" ? "dashboard.html" : "orders.html");

  // Once a business exists on this device, only login is offered. Staff are added by management.
  const setup = (await api.auth.status()).setup;
  let mode = setup ? "login" : "register";
  const form = document.getElementById("form");

  function render() {
    const register = mode === "register";
    document.getElementById("title").textContent = register ? "Set up your business" : "Welcome back";
    document.getElementById("sub").textContent = register
      ? "Create the management account for your restaurant."
      : "Please enter your details to login.";
    form.innerHTML =
      (register
        ? field("shop", "Business name", ICON.shop, "text", "Your restaurant's name", "organization") +
          field("name", "Full name", ICON.user, "text", "Your full name", "name")
        : "") +
      field("email", "Email", ICON.mail, "email", "you@example.com", "email") +
      field("password", "Password", ICON.lock, "password", "Your password", register ? "new-password" : "current-password",
        register ? "(8+ characters)" : "",
        register ? "" : '<button type="button" class="lnk" id="forgot">Forgot password?</button>') +
      `<label class="chk"><input type="checkbox" id="remember" checked> Remember me</label>
       <button class="pri go" id="go">${register ? "Create account" : "Login"} ${ICON.arrow}</button>
       <p class="swap">${
         setup
           ? "New staff member? Ask management to add you."
           : register
           ? 'Already have an account? <button type="button" id="swap">Login</button>'
           : 'Don’t have an account? <button type="button" id="swap">Register</button>'
       }</p>`;

    document.getElementById("eye").onclick = () => {
      const input = document.getElementById("password");
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      document.getElementById("eye").innerHTML = show ? ICON.eyeOff : ICON.eye;
      document.getElementById("eye").setAttribute("aria-label", show ? "Hide password" : "Show password");
    };
    const forgot = document.getElementById("forgot");
    if (forgot) forgot.onclick = () => toast("Ask management to reset your password for you.");
    const swap = document.getElementById("swap");
    if (swap) swap.onclick = () => { mode = register ? "login" : "register"; render(); };
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const v = (id) => document.getElementById(id).value;
    const go = document.getElementById("go");
    go.disabled = true;
    try {
      const remember = document.getElementById("remember").checked;
      if (mode === "register" && !setup)
        await api.auth.setup({ shop: v("shop"), name: v("name"), email: v("email"), password: v("password"), remember });
      else await api.auth.signIn({ email: v("email"), password: v("password"), remember });
      const u = await api.auth.session();
      location.href = u.role === "management" ? "dashboard.html" : "orders.html";
    } catch (err) {
      toast(err.message, true);
      go.disabled = false;
    }
  });

  render();
})();
  </script>
</body>
</html>
