<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d1614">
  <title>Requisitions — Kepcord</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell"><main class="pg" id="page"></main></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
boot({ id: "requisitions" }, async (me, root) => {
  const isM = me.role === "management";
  let reqs = [], names = [], recv = {};
  const shop = (await api.shop.info()).name;
  const N = (v) => Number(v || 0).toLocaleString("en-NG", { maximumFractionDigits: 2 });

  async function load() {
    [reqs, names] = await Promise.all([api.requisitions.open(), api.ingredients.list()]);
    draw();
  }
  const grand = () => reqs.reduce((s, r) => s + r.qty * (r.price || 0), 0);

  function draw() {
    const blanks = Math.max(0, 22 - reqs.length);
    root.innerHTML = `
      <h1>Requisitions</h1>
      <p class="mu">Items to buy. Low stock adds lines here by itself; anyone can add a line.</p>
      <div class="actions noprint"><button type="button" id="print">Print form</button></div>
      <div class="chips">
        <div><b>${reqs.length}</b><span>lines</span></div>
        <div><b id="c-grand">${naira(grand())}</b><span>total to spend</span></div>
      </div>
      <section class="xl">
        <div class="xl-rib"><b>Purchase requisition · ${esc(shop)}</b><span>${dmy(dayKey(new Date()))}</span></div>
        <div class="fx"><i>fx</i><div>Total = Quantity × Unit price. Type in the warm boxes to change a line.</div></div>
        <div class="sc"><table class="xt narrow">
          <thead><tr><th class="item">Description</th><th>Qty</th><th>Unit price</th><th>Total price</th></tr></thead>
          <tbody>${reqs.map((r) => `<tr>
            <td class="item">${esc(r.name)}<small>${esc(r.unit)}</small></td>
            <td class="in"><input type="number" inputmode="decimal" step="any" min="0" value="${r.qty}" data-q="${r.id}" aria-label="Quantity of ${esc(r.name)}"></td>
            <td class="in"><input type="number" inputmode="decimal" step="any" min="0" value="${r.price || 0}" data-p="${r.id}" aria-label="Unit price of ${esc(r.name)}"></td>
            <td class="cal" data-t="${r.id}">${N(r.qty * (r.price || 0))}</td></tr>`).join("")}
            ${Array.from({ length: blanks }, () => '<tr class="blank"><td class="item"></td><td></td><td></td><td></td></tr>').join("")}</tbody>
          <tfoot><tr><td class="item">TOTAL</td><td></td><td></td><td id="grand">${naira(grand())}</td></tr></tfoot>
        </table></div>
        ${reqs.length === 0 ? '<p class="fine">Nothing on the form yet. Add a line below.</p>' : ""}
        <p class="fine by">Ordered by: <b>${esc(me.name)}</b></p>
        <nav class="xl-tabs noprint" aria-label="Sheets"><a href="stock.html">Stock</a>${isM ? '<a href="inventory.html">Inventory</a>' : ""}<a href="requisitions.html" class="on" aria-current="page">Requisitions</a></nav>
      </section>

      <section class="noprint">
        <h2>Add a line</h2>
        <form id="addf" class="stack">
          <label>Description<input name="name" list="itemlist" required maxlength="80" autocomplete="off"></label>
          <datalist id="itemlist">${names.map((n) => `<option value="${esc(n.name)}">`).join("")}</datalist>
          <label>Quantity<input name="qty" type="number" inputmode="decimal" step="any" min="0" required></label>
          <label>Unit<select name="unit">${unitOptions("pcs")}</select></label>
          <label>Unit price (₦)<input name="price" type="number" inputmode="decimal" step="any" min="0" value="0"></label>
          <button class="pri">Add to form</button>
        </form>
        <p class="mu">If the description matches a stock item, its own unit is used and received goods are added to its stock.</p>

        <h2>When goods arrive</h2>
        ${reqs.length === 0 ? '<p class="mu">Nothing waiting.</p>' : reqs.map((r) => `<div class="arr">
          <span class="it"><b>${esc(r.name)}</b> · ordered ${qtyText(r.qty)} ${esc(r.unit)}</span>
          <input type="number" inputmode="decimal" step="any" min="0" value="${recv[r.id] ?? r.qty}" data-r="${r.id}" aria-label="Quantity received of ${esc(r.name)}">
          <span><button class="pri" data-recv="${r.id}">Received</button>${isM ? ` <button class="lnk del" data-dis="${r.id}">Dismiss</button>` : ""}</span></div>`).join("")}
      </section>`;
  }

  root.addEventListener("click", async (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.id === "print") return window.print();
    try {
      if (b.dataset.recv) {
        const q = Number(root.querySelector(`[data-r="${b.dataset.recv}"]`).value);
        await api.requisitions.receive(b.dataset.recv, q);
        toast("Received");
      } else if (b.dataset.dis) {
        if (!window.confirm("Remove this line from the form?")) return;
        await api.requisitions.dismiss(b.dataset.dis);
        toast("Removed");
      } else return;
    } catch (err) { toast(err.message, true); }
    load();
  });
  root.addEventListener("input", (e) => { if (e.target.dataset.r) recv[e.target.dataset.r] = e.target.value; });
  root.addEventListener("change", async (e) => {
    const t = e.target, id = t.dataset.q || t.dataset.p;
    if (!id) return;
    const tr = t.closest("tr");
    const q = Number(tr.querySelector("[data-q]").value), p = Number(tr.querySelector("[data-p]").value);
    try {
      await api.requisitions.update(id, { qty: q, price: p });
      const r = reqs.find((x) => x.id === id); r.qty = q; r.price = p;
      tr.querySelector("[data-t]").textContent = N(q * p);
      root.querySelector("#grand").textContent = naira(grand()); root.querySelector("#c-grand").textContent = naira(grand());
      toast("Saved");
    } catch (err) { toast(err.message, true); load(); }
  });
  root.addEventListener("submit", async (e) => {
    if (e.target.id !== "addf") return;
    e.preventDefault();
    const f = e.target;
    try {
      await api.requisitions.add({ name: f.name.value, qty: Number(f.qty.value), unit: f.unit.value, price: Number(f.price.value) });
      toast("Line added");
    } catch (err) { toast(err.message, true); }
    load();
  });
  await load();
});
  </script>
</body>
</html>
